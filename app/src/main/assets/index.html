  <style id="jm-style">
.jm-wrap{max-width:60rem;margin:0 auto;width:100%;padding:1rem;display:flex;flex-direction:column;gap:1rem;color:#e2e8f0}
.jm-card{background:rgba(15,23,42,.6);border:1px solid #1e293b;border-radius:1rem;padding:1rem}
.jm-h{font-weight:700;font-size:1.05rem;color:#e2e8f0;margin-bottom:.5rem}
.jm-h2{font-weight:600;font-size:.9rem;color:#67e8f9}
.jm-body{font-size:.85rem;color:#cbd5e1;line-height:1.5}
.jm-body p{margin:.4rem 0}
.jm-sub{font-size:.72rem;color:#94a3b8}
.jm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.6rem;margin-top:.4rem}
.jm-stat{background:#0b1220;border:1px solid #1e293b;border-radius:.75rem;padding:.6rem}
.jm-stat b{display:block;font-size:1.3rem;color:#22d3ee}
.jm-btn{padding:.4rem .75rem;border-radius:.6rem;border:1px solid #334155;background:#0f172a;color:#cbd5e1;font-size:.75rem;cursor:pointer}
.jm-btn:hover{border-color:#22d3ee;color:#67e8f9}
.jm-btn.danger:hover{border-color:#f43f5e;color:#fda4af}
.jm-btn.primary{background:rgba(6,182,212,.2);border-color:rgba(34,211,238,.5);color:#67e8f9}
.jm-in{width:100%;background:#0b1220;border:1px solid #334155;border-radius:.6rem;color:#e2e8f0;padding:.5rem .7rem;font-size:.85rem;outline:none;font-family:inherit}
.jm-in:focus{border-color:#22d3ee}
.jm-inline{width:auto;display:inline-block;margin-left:.4rem}
.jm-item{border:1px solid #1e293b;background:#0b1220;border-radius:.75rem;padding:.7rem}
.jm-tag{font-size:.65rem;padding:.1rem .45rem;border-radius:999px;background:#1e293b;color:#94a3b8}
.jm-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.jm-between{justify-content:space-between}
.jm-col{display:flex;flex-direction:column;gap:.45rem}
.jm-flash{margin-top:.6rem;padding:.4rem .7rem;border-radius:.6rem;background:rgba(6,182,212,.12);border:1px solid rgba(34,211,238,.35);color:#a5f3fc;font-size:.8rem}
</style>

<style id="rx-style">
:root{--rx-bg:#07060c;--rx-side:#0b0a11;--rx-b:rgba(255,255,255,.08);--rx-t:#f3f2f8;--rx-m:#8b8898;--rx-card:rgba(255,255,255,.045);--rx-hov:rgba(255,255,255,.07);--rx-g1:rgba(124,58,237,.40);--rx-g2:rgba(91,33,182,.26)}
[data-theme=light]{--rx-bg:#f5f4fa;--rx-side:#fff;--rx-b:rgba(24,18,48,.11);--rx-t:#16121f;--rx-m:#6a667a;--rx-card:rgba(255,255,255,.85);--rx-hov:rgba(24,18,48,.06);--rx-g1:rgba(167,139,250,.42);--rx-g2:rgba(196,181,253,.38)}
html,body{background:var(--rx-bg)!important;color:var(--rx-t)}
.rx-app{display:flex;height:100vh;height:100dvh;overflow:hidden;font-family:"Plus Jakarta Sans","Hind Siliguri",Inter,system-ui,sans-serif;background:var(--rx-bg);color:var(--rx-t)}
:where(.rx-app) button,:where(.rx-app) select,:where(.rx-app) textarea{font:inherit;color:inherit}
:where(.rx-app) button{cursor:pointer;background:none;border:0}
.rx-app :focus-visible{outline:2px solid #a78bfa;outline-offset:2px}
.rx-side{width:248px;flex:none;display:flex;flex-direction:column;padding:14px 10px 10px;background:var(--rx-side);border-right:1px solid var(--rx-b);transition:margin .22s ease}
.rx-side[data-open=false]{margin-left:-248px;visibility:hidden}
.rx-brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.rx-logo{width:34px;height:34px;border-radius:50%;background:#f5f4f0;display:grid;place-items:center}
.rx-name{font-weight:700;font-size:17px;flex:1}
.rx-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--rx-m)}
.rx-ico:hover{background:var(--rx-hov);color:var(--rx-t)}
.rx-new{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;font-weight:600;font-size:14px;background:var(--rx-hov);border:1px solid var(--rx-b)!important}
.rx-lbl{font-size:12px;font-weight:600;color:var(--rx-m);padding:16px 12px 6px}
.rx-item{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:500;text-align:left}
.rx-item:hover,.rx-chat:hover{background:var(--rx-hov)}
.rx-item[data-on=true],.rx-chat[data-on=true]{background:rgba(139,92,246,.16);color:#c4b5fd}
.rx-hist{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.rx-chat{display:flex;align-items:center;border-radius:10px}
.rx-ct{flex:1;min-width:0;padding:8px 12px;text-align:left;font-size:13.5px;color:var(--rx-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rx-chat:hover .rx-ct,.rx-chat[data-on=true] .rx-ct{color:var(--rx-t)}
.rx-del{display:none;width:28px;height:28px;margin-right:4px;border-radius:8px;place-items:center;color:var(--rx-m)}
.rx-chat:hover .rx-del,.rx-del:focus-visible{display:grid}
.rx-del:hover{color:#fb7185}
.rx-empty{padding:8px 12px;font-size:13px;color:var(--rx-m)}
.rx-user{display:flex;align-items:center;gap:10px;width:100%;padding:10px;margin-top:8px;border-radius:12px;text-align:left}
.rx-user:hover{background:var(--rx-hov)}
.rx-av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.rx-ut{display:flex;flex-direction:column;min-width:0;line-height:1.3}.rx-ut b{font-size:13.5px}.rx-ut small{font-size:12px;color:var(--rx-m)}
.rx-main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:radial-gradient(900px 520px at 88% -8%,var(--rx-g1),transparent 65%),radial-gradient(700px 520px at 4% 108%,var(--rx-g2),transparent 62%),var(--rx-bg)}
.rx-top{height:61px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px}
.rx-p{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;background:var(--rx-card);border:1px solid var(--rx-b)!important;white-space:nowrap}
.rx-p:hover{background:var(--rx-hov)}
.rx-round{width:36px;padding:0;justify-content:center}
.rx-stop{color:#fda4af;border-color:rgba(244,63,94,.5)!important}
.rx-dot{width:8px;height:8px;border-radius:50%;background:#34d399}.rx-dot[data-k=warn]{background:#fbbf24}.rx-dot[data-k=bad]{background:#fb7185}
.rx-content{flex:1;min-height:0;overflow-y:auto}
.rx-legacy{filter:hue-rotate(58deg)}
[data-theme=light] .rx-legacy{filter:invert(1) hue-rotate(238deg)}
.rx-home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 0 20px}
.rx-orb{width:92px;height:92px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#22d3ee,#8b5cf6,#ec4899,#f59e0b,#22d3ee);box-shadow:0 0 44px rgba(139,92,246,.4)}
.rx-orb-in{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#f5f4f0}
.rx-orb[data-s=listening]{background:conic-gradient(#10b981,#22d3ee,#10b981);box-shadow:0 0 54px rgba(16,185,129,.55);animation:rxp 1.3s ease-in-out infinite}
.rx-orb[data-s=speaking]{background:conic-gradient(#22d3ee,#ec4899,#22d3ee);animation:rxp 1.1s ease-in-out infinite}
.rx-orb[data-s=thinking]{animation:rxs 1.6s linear infinite}.rx-orb[data-s=thinking] .rx-orb-in{animation:rxs 1.6s linear infinite reverse}
@keyframes rxp{50%{transform:scale(1.07)}}@keyframes rxs{to{transform:rotate(360deg)}}
.rx-h1{margin:28px 16px 30px;text-align:center;font-size:clamp(26px,3.6vw,38px);font-weight:700;letter-spacing:-.015em;line-height:1.2}
.rx-chips{display:flex;flex-wrap:wrap;gap:8px;width:min(720px,92%);margin-bottom:12px}
.rx-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;background:var(--rx-card);border:1px solid var(--rx-b)!important}
.rx-chip:hover{background:var(--rx-hov)}.rx-chip svg{color:var(--rx-m)}
.rx-comp{width:min(720px,92%);padding:16px 16px 12px;border-radius:22px;border:1px solid var(--rx-b);background:linear-gradient(135deg,rgba(139,92,246,.13),var(--rx-card) 62%)}
.rx-comp:focus-within{border-color:rgba(167,139,250,.6)}
.rx-in{display:flex;gap:10px;align-items:flex-start;color:#a78bfa;padding:0 4px}
.rx-in svg{margin-top:3px;flex:none}
.rx-in textarea{flex:1;background:none;border:0;outline:0;resize:none;font-size:15px;line-height:1.55;min-height:24px;max-height:160px;color:var(--rx-t)}
.rx-in textarea::placeholder{color:var(--rx-m)}
.rx-bar{display:flex;align-items:center;gap:8px;margin-top:14px}
.rx-tool,.rx-sel{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px;border-radius:9px;font-size:13px;color:var(--rx-m)}
.rx-tool:hover,.rx-sel:hover{background:var(--rx-hov);color:var(--rx-t)}
.rx-sel select{background:none;border:0;outline:0;cursor:pointer;color:inherit;font-size:13px}.rx-sel option{color:#111}
.rx-c{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.rx-call{color:#a78bfa}.rx-call:hover{background:var(--rx-hov)}
.rx-mic{background:var(--rx-hov)!important;border:1px solid var(--rx-b)!important}
.rx-mic[data-on=true]{background:#10b981!important;color:#04130d;animation:rxp 1.2s ease-in-out infinite}
.rx-send{background:linear-gradient(135deg,#a78bfa,#7c3aed)!important;color:#fff}
.rx-send:disabled{opacity:.4;cursor:not-allowed}
.rx-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:min(720px,92%);margin-top:14px}
.rx-card{position:relative;display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:16px;text-align:left;background:var(--rx-card);border:1px solid var(--rx-b)!important}
.rx-card:hover{background:var(--rx-hov)}
.rx-card b{font-size:14px;margin-top:10px}.rx-card small{font-size:12.5px;line-height:1.45;color:var(--rx-m)}
.rx-ci{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--rx-hov);color:var(--rx-m)}
.rx-tag{position:absolute;top:14px;right:14px;padding:3px 10px;border-radius:999px;font-size:11px;border:1px solid var(--rx-b);color:var(--rx-m)}
.rx-scrim{display:none}
@media(max-width:799px){
 .rx-side{position:fixed;inset:0 auto 0 0;z-index:60;box-shadow:12px 0 40px rgba(0,0,0,.5)}
 .rx-side[data-open=false]{margin-left:0;transform:translateX(-105%)}
 .rx-scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.55)}
 .rx-p span{display:none}.rx-p{padding:0 11px}.rx-stop span{display:inline}
 .rx-top{padding:0 10px;gap:6px}
 .rx-tool{display:none}
}

.rx-side{background:linear-gradient(180deg,var(--rx-side),var(--rx-bg));box-shadow:1px 0 0 rgba(255,255,255,.02),12px 0 60px -30px rgba(124,58,237,.35)}
